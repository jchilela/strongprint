# Produção (strongprint.it.ao). Corre em /opt/strongprint no servidor.
# O nginx do servidor faz HTTPS e encaminha para 127.0.0.1:8100.
x-app: &app
  build:
    context: .
    args:
      INSTALL_DEV: "0"
  image: strongprint:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  s3:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: server -ip=s3 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro

  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_bucket &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      # WEB_BIND=0.0.0.0 no .env expõe a porta à internet (só em desenvolvimento).
      - "${WEB_BIND:-127.0.0.1}:8100:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info -Q default,analysis,printing,monitoring

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

volumes:
  pgdata:
  redisdata:
  s3data:
