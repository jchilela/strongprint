{% load i18n portal %}
<figure class="card chart">
  <figcaption class="small muted">{% translate "Revenue per day" %}</figcaption>
  <div class="bars" role="img" aria-label="{% translate 'Revenue per day' %}">
    {% for d in daily %}
    <div class="bar" title="{{ d.day|date:'d/m' }}: {{ d.kz|kz }}"><span style="height: {{ d.pct }}%"></span>{% if daily|length <= 14 %}<small>{{ d.day|date:"d/m" }}</small>{% endif %}</div>
    {% endfor %}
  </div>
</figure>
