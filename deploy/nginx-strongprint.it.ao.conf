# /etc/nginx/sites-available/strongprint.it.ao
# Depois de ativar: certbot --nginx -d <cada subdomínio> (ver deploy/deploy.sh)
server {
    listen 80;
    listen [::]:80;
    server_name strongprint.it.ao www.strongprint.it.ao client.strongprint.it.ao administ.strongprint.it.ao api.strongprint.it.ao app.strongprint.it.ao partner.strongprint.it.ao ecra.strongprint.it.ao;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
