[project]
name = "strongprint"
version = "0.1.0"
description = "StrongPrint — orquestrador central da rede de kiosks de impressão"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "django-environ>=0.12,<0.13",
    "psycopg[binary]>=3.2,<3.3",
    "redis>=5.2,<6",
    "celery>=5.5,<5.6",
    "structlog>=25.1",
    "boto3>=1.37",
    "phonenumbers>=9.0",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --ds=config.settings.test"
filterwarnings = ["ignore:No directory at:UserWarning"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["domain", "apps", "common"]
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
